{{/* vim: set filetype=mustache: */}}

{{- if .Values.httpRoute.enabled }}
{{- $fullName := include "folio-common.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-backend
  namespace: {{ .Release.Namespace }}
spec:
  rules:
  {{- range .Values.httpRoute.rules }}
  - backendRefs:
    {{- range .backendRefs }}
    - name: {{ .name }}
      port: {{ .port }}
    {{- end }}
    matches:
    {{- range .matches }}
      - path:
          type: {{ .path.type }}
          value: {{ .path.value }}
    {{- end }}
  {{- end }}
  hostnames:
  {{- range .Values.httpRoute.hostnames }}
  - {{ . }}
  {{- end }}
  parentRefs:
  {{- range .Values.httpRoute.parentRefs }}
  - name: {{ .name }}
  {{- end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $fullName }}-ip-limits
  namespace: {{ .Release.Namespace }}
spec:
    targetRefs:
      - kind: HTTPRoute
        group: gateway.networking.k8s.io
        name: {{ $fullName }}-backend
    authorization:
      defaultAction: Deny
      rules:
        - action: Allow
          principal:
            clientCIDRs:
            {{- range .Values.httpRoute.allowedCIDRs }}
            - {{ . }}
            {{- end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $fullName }}-cors
  namespace: {{ .Release.Namespace }}
spec:
    targetRefs:
      - kind: HTTPRoute
        group: gateway.networking.k8s.io
        name: {{ $fullName }}-backend
    cors:
      allowOrigins:
      {{- range .Values.httpRoute.allowOrigins }}
      - {{ . }}
      {{- end }}
      allowMethods:
      {{- range .Values.httpRoute.allowMethods }}
      - {{ . }}
      {{- end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $fullName }}-custom-error-page
  namespace: {{ .Release.Namespace }}
spec:
    targetRefs:
      - kind: HTTPRoute
        group: gateway.networking.k8s.io
        name: {{ $fullName }}-backend
    responseOverride:
      - match:
          statusCodes:
          - type: Value
            value: 403
        response:
          contentType: text/html
          body:
            type: Inline
            inline: "You are not authorized to access FOLIO. A connection to the Stanford Network is required."
{{- end -}}